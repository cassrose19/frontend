<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>MelodyMind</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'pastel-mint': '#E7F2D0',
            'pastel-sage': '#BEDDB3',
            'pastel-lavender': '#B2A3D4',
            'pastel-blue': '#A8D8EA'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-pastel-mint to-pastel-blue flex flex-col">

  <!-- HEADER + SEARCH (centered) -->
  <div class="w-full max-w-2xl mx-auto p-4">
    <div class="text-center">
      <h1 class="text-4xl font-bold text-gray-700">MelodyMind</h1>
      <p class="text-gray-600">Describe what you're in the mood to listen to</p>
      <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-8 shadow-lg border border-white/50 mt-4">
        <textarea id="prompt" placeholder="e.g., music for relaxing by the beach…"
          class="w-full h-32 px-4 py-3 rounded-xl bg-pastel-mint/30 border-2 border-pastel-sage text-gray-700 placeholder-gray-500 focus:outline-none focus:border-pastel-lavender resize-none"></textarea>
        <button
          class="w-full bg-pastel-lavender hover:bg-purple-300 text-white font-semibold py-3 px-6 rounded-xl mt-4">Search
          Music</button>
      </div>
    </div>
  </div>

  <!-- MAIN LAYOUT (Sidebar + Results) -->
  <div class="app-container flex w-full">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar p-4 border-r border-gray-300" style="flex:0 0 250px;">
      <h3 class="font-bold text-lg">My Playlists</h3>
      <div id="playlist-list"></div>
    </aside>

    <!-- Results Area -->
    <main class="flex-1 p-4">
      <h2>Results:</h2>
      <p class="instructions">Click the "+" next to a song to add it to a playlist.</p>
      <div id="results"></div>
    </main>
  </div>

  <!-- Scripts -->
  <script type="module" src="script.js"></script>
</body>

</html>
