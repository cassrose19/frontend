<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>MelodyMind</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'pastel-mint': '#E7F2D0',
            'pastel-sage': '#BEDDB3',
            'pastel-lavender': '#B2A3D4',
            'pastel-blue': '#A8D8EA'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-pastel-mint to-pastel-blue flex flex-col">

  <!-- HEADER -->
  <header class="bg-white/80 backdrop-blur-sm border-b border-white/50 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center py-4">
        <div class="flex items-center">
          <a href="index.html"
            class="text-2xl font-bold text-gray-700 hover:text-pastel-lavender transition-colors">MelodyMind</a>
        </div>
        <nav class="flex items-center space-x-4">
          <div id="auth-buttons" class="flex items-center space-x-3">
            <!-- Login button (shown when not logged in) -->
            <a href="login.html" id="login-btn"
              class="bg-gradient-to-r from-pastel-lavender to-pastel-blue hover:from-purple-300 hover:to-blue-300 text-white px-4 py-2 rounded-lg transition-all duration-200">
              Login
            </a>

            <!-- User info and buttons (shown when logged in) -->
            <div id="user-info" class="flex items-center space-x-3 hidden">
              <a href="mypage.html"
                class="flex items-center space-x-2 bg-white/70 px-3 py-1 rounded-full shadow-sm hover:bg-pastel-mint transition-all">
                <div
                  class="w-8 h-8 rounded-full bg-gradient-to-br from-pastel-lavender to-pastel-blue flex items-center justify-center text-white font-semibold text-base shadow">
                  <span id="user-avatar">J</span>
                </div>
                <span class="text-gray-700 font-medium text-base">Hi, <span id="user-name">Guest</span></span>
              </a>
              <button id="logout-btn"
                class="flex items-center gap-1 bg-gradient-to-r from-red-400 to-red-500 hover:from-red-500 hover:to-red-600 text-white px-4 py-1.5 rounded-full shadow transition-colors text-sm font-semibold">
                <i class="fa fa-sign-out"></i>
                Logout
              </button>
            </div>
          </div>
        </nav>
      </div>
    </div>
  </header>

  <!-- SEARCH (centered) -->
  <div class="w-full max-w-2xl mx-auto p-4">
    <div class="text-center">
      <h2 class="text-3xl font-bold text-gray-700 mb-2">Find Your Perfect Music</h2>
      <p class="text-gray-600">Describe what you're in the mood to listen to</p>
      <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-8 shadow-lg border border-white/50 mt-4">
        <textarea id="prompt" placeholder="e.g., music for relaxing by the beach…"
          class="w-full h-32 px-4 py-3 rounded-xl bg-pastel-mint/30 border-2 border-pastel-sage text-gray-700 placeholder-gray-500 focus:outline-none focus:border-pastel-lavender resize-none"></textarea>

        <!-- Filter Options -->
        <div class="mt-6 p-6 bg-white/60 backdrop-blur-sm rounded-2xl border border-white/30 shadow-sm">
          <h4 class="text-sm font-bold text-gray-700 mb-6 flex items-center">
            <svg class="w-4 h-4 mr-2 text-pastel-lavender" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M3 3a1 1 0 011-1h12a1 1 0 011 1v3a1 1 0 01-.293.707L12 11.414V15a1 1 0 01-.293.707l-2 2A1 1 0 018 17v-5.586L3.293 6.707A1 1 0 013 6V3z"
                clip-rule="evenodd"></path>
            </svg>
            Filter Options
          </h4>

          <div class="space-y-6">
            <!-- Energy Filter (Dual Thumb, Highlighted Range) -->
            <div class="bg-gradient-to-r from-pastel-mint/20 to-pastel-sage/20 p-4 rounded-xl">
              <label class="block text-sm font-medium text-gray-700 mb-3 flex items-center">
                <span class="w-2 h-2 bg-pastel-sage rounded-full mr-2"></span>
                Energy Level
              </label>
              <div class="space-y-2">
                <div class="flex justify-between text-xs text-gray-500">
                  <span>Low</span>
                  <span>High</span>
                </div>
                <div class="relative w-full h-8 flex items-center">
                  <div id="energy_range_highlight"
                    class="absolute h-2 rounded-lg bg-gradient-to-r from-pastel-lavender to-pastel-sage opacity-60 z-0 transition-all duration-200">
                  </div>
                  <input type="range" id="energy_min" min="0" max="1" step="0.01" value="0.4"
                    class="absolute w-full h-2 bg-gray-200 rounded-lg appearance-none slider-thumb z-10">
                  <input type="range" id="energy_max" min="0" max="1" step="0.01" value="1.0"
                    class="absolute w-full h-2 bg-gray-200 rounded-lg appearance-none slider-thumb z-20">
                </div>
                <div class="flex justify-between text-xs text-gray-700 font-bold mt-3">
                  <span>Min: <span id="energy_min_val">0.4</span></span>
                  <span>Max: <span id="energy_max_val">1.0</span></span>
                </div>
              </div>
            </div>

            <!-- Artist Filter -->
            <div class="bg-gradient-to-r from-pastel-lavender/20 to-pastel-blue/20 p-4 rounded-xl">
              <label class="block text-sm font-medium text-gray-700 mb-3 flex items-center">
                <span class="w-2 h-2 bg-pastel-lavender rounded-full mr-2"></span>
                Artist
              </label>
              <div class="relative">
                <input type="text" id="artist" placeholder="Search for your favorite artist..."
                  class="w-full px-4 py-3 pl-10 rounded-xl bg-white/80 border-2 border-transparent text-gray-700 placeholder-gray-400 focus:outline-none focus:border-pastel-lavender focus:bg-white transition-all">
                <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400" fill="none"
                  stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </div>
            </div>

            <!-- Genre Filter -->
            <div class="metadata-card mb-4">
              <label for="genre-select" class="block font-medium text-gray-700 mb-2">Genre</label>
              <select id="genre-select"
                class="w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                <option value="">Any</option>
                <option value="pop">Pop</option>
                <option value="rock">Rock</option>
                <option value="hip-hop / rap">Hip-Hop / Rap</option>
                <option value="r&b / soul">R&B / Soul</option>
                <option value="country">Country</option>
                <option value="folk / indie">Folk / Indie</option>
                <option value="electronic / dance">Electronic / Dance</option>
                <option value="alternative / metal">Alternative / Metal</option>
                <option value="other">Other</option>
              </select>
            </div>


            <!-- Popularity Filter (Dual Thumb, Highlighted Range) -->
            <div class="bg-gradient-to-r from-pastel-blue/20 to-pastel-mint/20 p-4 rounded-xl">
              <label class="block text-sm font-medium text-gray-700 mb-3 flex items-center">
                <span class="w-2 h-2 bg-pastel-blue rounded-full mr-2"></span>
                Popularity
              </label>
              <div class="space-y-2">
                <div class="flex justify-between text-xs text-gray-500">
                  <span>Underground</span>
                  <span>Mainstream</span>
                </div>
                <div class="relative w-full h-8 flex items-center">
                  <div id="popularity_range_highlight"
                    class="absolute h-2 rounded-lg bg-gradient-to-r from-pastel-lavender to-pastel-blue opacity-60 z-0 transition-all duration-200">
                  </div>
                  <input type="range" id="popularity_min" min="0" max="100" step="1" value="60"
                    class="absolute w-full h-2 bg-gray-200 rounded-lg appearance-none slider-thumb z-10">
                  <input type="range" id="popularity_max" min="0" max="100" step="1" value="100"
                    class="absolute w-full h-2 bg-gray-200 rounded-lg appearance-none slider-thumb z-20">
                </div>
                <div class="flex justify-between text-xs text-gray-700 font-bold mt-3">
                  <span>Min: <span id="popularity_min_val">60</span></span>
                  <span>Max: <span id="popularity_max_val">100</span></span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <button id="search-btn"
          class="w-full bg-gradient-to-r from-pastel-lavender to-pastel-blue hover:from-purple-300 hover:to-blue-300 text-white font-bold py-4 px-8 rounded-xl mt-6 shadow-lg transform hover:scale-105 transition-all duration-200 flex items-center justify-center group">
          <svg class="w-5 h-5 mr-2 group-hover:animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          Search Music
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN LAYOUT (Sidebar + Results) -->
  <div class="app-container flex w-full">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar p-6 border-r border-white/30 bg-white/20 backdrop-blur-sm"
      style="flex:0 0 280px;">
      <div class="mb-6">
        <h3 class="font-bold text-xl text-gray-700 flex items-center mb-4">
          <svg class="w-6 h-6 mr-2 text-pastel-lavender" fill="currentColor" viewBox="0 0 20 20">
            <path
              d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z">
            </path>
          </svg>
          My Playlists
        </h3>
      </div>
      <div id="playlist-list" class="space-y-3"></div>
    </aside>

    <!-- Results Area -->
    <main class="flex-1 p-6 bg-white/10 backdrop-blur-sm">
      <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-700 mb-2 flex items-center">
          <svg class="w-6 h-6 mr-2 text-pastel-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 19V6l12-1v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-1">
            </path>
          </svg>
          Results
        </h2>
        <p class="text-gray-600 bg-white/60 p-3 rounded-lg border border-white/50 flex items-center">
          <svg class="w-4 h-4 mr-2 text-pastel-lavender" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Click the "+" next to a song to add it to a playlist.
        </p>
      </div>
      <div id="results" class="space-y-4"></div>
    </main>
  </div>

  <!-- Scripts -->
  <script type="module" src="script.js"></script>
</body>

</html>
