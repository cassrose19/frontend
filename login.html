<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login to MelodyMind</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">

  <h1 class="mb-4">🎵 Welcome to MelodyMind</h1>
  <p class="mb-4">Log in with Spotify to create playlists based on your music mood</p>

  <button onclick="loginWithSpotify()" class="btn btn-success btn-lg">Login with Spotify</button>

  <script>
    const CLIENT_ID = "b6937ebfce5b4e7db6d48ca1eb148796";  
    const REDIRECT_URI = "http://127.0.0.1:5051/callback";
    const SCOPES = "playlist-modify-private playlist-modify-public";

    function loginWithSpotify() {
      const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}`;
      window.location.href = authUrl;
    }
  </script>

</body>
</html>
