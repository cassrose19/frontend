<!-- login.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login to MelodyMind</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC_Rj7M8HvZKTgy-eWMrrHmmtR1Snh81cM",
      authDomain: "melodymind-sum2025.firebaseapp.com",
      projectId: "melodymind-sum2025",
      storageBucket: "melodymind-sum2025.firebasestorage.app",
      messagingSenderId: "328293709777",
      appId: "1:328293709777:web:374aefbd982d9c84d152f0"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    window.loginWithFirebase = async function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = "index.html";
      } catch (error) {
        alert("Login failed: " + error.message);
      }
    };

    window.loginWithGoogle = async function () {
      try {
        const result = await auth.signInWithPopup(provider);
        const user = result.user;
        console.log("Google user:", user.email);
        window.location.href = "index.html";
      } catch (error) {
        alert("Google login failed: " + error.message);
      }
    };

    window.loginWithSpotify = function () {
      const CLIENT_ID = "b6937ebfce5b4e7db6d48ca1eb148796";
      const REDIRECT_URI = "http://127.0.0.1:5051/callback";
      const SCOPES = "playlist-modify-private playlist-modify-public";
      const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}`;
      window.location.href = authUrl;
    };
  </script>

</head>

<body class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">
  <h1 class="mb-2">🎵 Welcome to MelodyMind</h1>
  <p class="mb-4">Sign in to find your vibe in music</p>

  <div class="bg-white p-4 rounded shadow-sm w-100" style="max-width: 400px;">
    <input type="email" id="email" placeholder="Email" class="form-control mb-2" required />
    <input type="password" id="password" placeholder="Password" class="form-control mb-3" required />
    <button onclick="loginWithFirebase()" class="btn btn-primary w-100 mb-3">Sign In</button>

    <div class="text-center my-2">or</div>
    <button onclick="loginWithSpotify()" class="btn btn-success w-100 mb-2">Continue with Spotify</button>
    <button onclick="loginWithGoogle()" class="google-btn w-100 d-flex align-items-center justify-content-center">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo" class="me-2"
        style="height: 20px;">
      <span>Sign in with Google</span>
    </button>

  </div>

  <p class="mt-3">Don’t have an account? <a href="signup.html"><strong>Sign up</strong></a></p>
</body>

</html>
