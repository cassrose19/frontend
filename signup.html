<!-- signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up for MelodyMind</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC_Rj7M8HvZKTgy-eWMrrHmmtR1Snh81cM",
      authDomain: "melodymind-sum2025.firebaseapp.com",
      projectId: "melodymind-sum2025",
      storageBucket: "melodymind-sum2025.firebasestorage.app",
      messagingSenderId: "328293709777",
      appId: "1:328293709777:web:374aefbd982d9c84d152f0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.signUpWithFirebase = async function () {
      const email = document.getElementById("signup-email").value;
      const password = document.getElementById("signup-password").value;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        document.getElementById("signup-form").style.display = "none";
        document.getElementById("thank-you").style.display = "block";
      } catch (error) {
        alert("Signup failed: " + error.message);
      }
    };

    window.goToIndex = function () {
      window.location.href = "index.html";
    };
  </script>
</head>

<body class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">
  <h1 class="mb-3">Create your MelodyMind account</h1>

  <div id="signup-form" class="bg-white p-4 rounded shadow-sm w-100" style="max-width: 400px;">
    <input type="email" id="signup-email" placeholder="Email" class="form-control mb-2" required />
    <input type="password" id="signup-password" placeholder="Password" class="form-control mb-3" required />
    <button onclick="signUpWithFirebase()" class="btn btn-primary w-100">Sign Up</button>
  </div>

  <script type="module">
    // Hitting enter triggers signUpWithFirebase()
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("signup-email").addEventListener("keydown", handleSignupEnter);
      document.getElementById("signup-password").addEventListener("keydown", handleSignupEnter);
    });
    function handleSignupEnter(e) {
      if (e.key === "Enter") {
        window.signUpWithFirebase();
      }
    }
  </script>

  <div id="thank-you" class="text-center" style="display: none;">
    <h4 class="mt-3">Thank you for joining MelodyMind!</h4>
    <button onclick="goToIndex()" class="btn btn-success mt-3">Continue to MelodyMind</button>
  </div>
</body>
</html>
