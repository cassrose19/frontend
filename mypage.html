<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>My Page - MelodyMind</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'pastel-mint': '#E7F2D0',
            'pastel-sage': '#BEDDB3',
            'pastel-lavender': '#B2A3D4',
            'pastel-blue': '#A8D8EA'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-pastel-mint to-pastel-blue">
  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-sm border-b border-white/50 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center py-4">
        <div class="flex items-center">
          <a href="index.html" class="text-2xl font-bold text-gray-700 hover:text-pastel-lavender transition-colors">MelodyMind</a>
        </div>
        <nav class="flex items-center space-x-4">
          <div id="auth-buttons" class="flex items-center space-x-3">
            <!-- Login button (shown when not logged in) -->
            <a href="login.html" id="login-btn" class="bg-gradient-to-r from-pastel-lavender to-pastel-blue hover:from-purple-300 hover:to-blue-300 text-white px-4 py-2 rounded-lg transition-all duration-200">
              Login
            </a>
            <!-- User info and buttons (shown when logged in) -->
            <div id="user-info" class="flex items-center space-x-3 hidden">
              <a href="mypage.html" class="flex items-center space-x-2 bg-white/70 px-3 py-1 rounded-full shadow-sm hover:bg-pastel-mint transition-all">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-pastel-lavender to-pastel-blue flex items-center justify-center text-white font-semibold text-base shadow">
                  <span id="user-avatar">J</span>
                </div>
                <span class="text-gray-700 font-medium text-base">Hi, <span id="user-name">Guest</span></span>
              </a>
              <button id="logout-btn" class="flex items-center gap-1 bg-gradient-to-r from-red-400 to-red-500 hover:from-red-500 hover:to-red-600 text-white px-4 py-1.5 rounded-full shadow transition-colors text-sm font-semibold">
                <i class="fa fa-sign-out"></i>
                Logout
              </button>
            </div>
          </div>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-8 shadow-lg border border-white/50">
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-700 mb-2">My Playlists</h1>
        <p class="text-gray-600">Manage your music collections</p>
      </div>


      <!-- Playlists Grid -->
      <div id="playlists-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Playlists will be populated here -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="text-center py-12 hidden">
        <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-1v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-1"></path>
        </svg>
        <h3 class="text-lg font-medium text-gray-700 mb-2">No playlists yet</h3>
        <p class="text-gray-500 mb-4">Start by creating your first playlist!</p>
      </div>
    </div>
  </main>

  <!-- Playlist Detail Modal -->
  <div id="playlist-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl p-8 max-w-4xl w-full mx-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-6">
        <h2 id="modal-title" class="text-2xl font-bold text-gray-700"></h2>
        <button id="close-modal" class="text-gray-500 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      
      <div id="modal-content" class="space-y-4">
        <!-- Playlist songs will be populated here -->
      </div>
      
      <div class="mt-6 flex justify-end space-x-3">
        <button id="delete-playlist-btn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition-colors">
          Delete Playlist
        </button>
        <button id="close-modal-btn" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition-colors">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="mypage.js"></script>
</body>

</html>
